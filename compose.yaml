services:
  solver:
    build: .
    restart: unless-stopped
    environment:
      SOLVER_SECRET: ${SOLVER_SECRET:?Set a random SOLVER_SECRET in .env}
      WARMUP: "true"
      GENERATE_IT_ENDPOINT: ${GENERATE_IT_ENDPOINT:-google}
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1536m
    pids_limit: 128
    cpus: 2
    stop_grace_period: 5s
  caddy:
    image: caddy:2.11.2-alpine
    restart: unless-stopped
    environment:
      SOLVER_DOMAIN: ${SOLVER_DOMAIN:?Set SOLVER_DOMAIN in .env}
      SOLVER_SECRET: ${SOLVER_SECRET:?Set a random SOLVER_SECRET in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      solver:
        condition: service_healthy
    security_opt: [no-new-privileges:true]
volumes:
  caddy_data:
  caddy_config:
